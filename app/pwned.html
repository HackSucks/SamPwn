<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOT BY NVME :3</title>
<style>
@font-face{font-family:'SampwnMono';src:url('sampwn-mono.ttf') format('truetype');font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cfe}
canvas{position:fixed;left:0;top:0;width:100%;height:100%}
#msgs{position:fixed;left:0;right:0;top:70%;text-align:center;padding:0 5vw}

#intro{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:calc(13px + .8vw) system-ui,sans-serif;letter-spacing:.22em;color:#bde;text-shadow:0 0 12px #58f;opacity:0;transition:opacity 1s;padding:0 8vw}

#fade{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.5s}
#fade.on{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;font:13px system-ui,sans-serif;color:#89a;opacity:0;transition:opacity .6s}

<div id="intro"></div>

var MSG_DELAY=1.5;
var MSG2_DELAY=3;     // seconds after the message before the second line appears
var INTRO_SECS=4;     // how long the intro text stays alone on black; the starfield fades in after it    // seconds after the text is complete before the message appears
// ============================================================

if(qget('msg'))CONFIG.message=qget('msg');
if(qget('font'))CONFIG.font=qget('font');
if(qget('intro')!==null)CONFIG.intro=qget('intro');
if(qget('msg2')!==null)CONFIG.message2=qget('msg2');

  var p=null;
  try{p=au.play()}catch(e){}
  if(p&&p.then){p.then(function(){onAudioStart()}).catch(function(){onAudioBlocked()})}
  else if(au.paused){onAudioBlocked()}
  else{onAudioStart()}
  setTimeout(function(){armed=true},800);
}
function resumeAudio(){
  if(closing)return;
  if(!running){begin();return}
  try{au.currentTime=clock}catch(e){}
  var p=null;
  try{p=au.play()}catch(e){}
  if(p&&p.then){p.then(function(){onAudioStart()}).catch(function(){})}
  else{onAudioStart()}
}
function registerTVKeys(){
  try{
    if(window.tizen&&tizen.tvinputdevice&&tizen.tvinputdevice.registerKey){
      ['MediaPlayPause','MediaPlay','MediaPause','MediaStop','MediaFastForward','MediaRewind','ColorF0Red','ColorF1Green','ColorF2Yellow','ColorF3Blue','Info','Caption','Subtitle','PictureSize','Soccer','Teletext','SmartHub'].forEach(function(k){
        try{tizen.tvinputdevice.registerKey(k)}catch(e){}
      });
    }
  }catch(e){}
}
registerTVKeys();
addEventListener('keydown',function(e){
  var k=e.keyCode||0;
  if(k===10009){closeIt();return}
  if(!running)begin();
  else if(au.paused)resumeAudio();
},true);
addEventListener('pointerdown',function(){if(!running)begin();else if(au.paused)resumeAudio()},true);
addEventListener('touchstart',function(){if(!running)begin();else if(au.paused)resumeAudio()},true);
function ding(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    var ac=new C();if(ac.resume)ac.resume();
    var t0=ac.currentTime,out=ac.createGain();out.gain.value=.22;out.connect(ac.destination);
    [[1318.5,1],[2637,.35],[3951,.15]].forEach(function(p){
      var o=ac.createOscillator(),gn=ac.createGain();
      o.type='sine';o.frequency.value=p[0];
      gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(p[1],t0+.005);
      gn.gain.exponentialRampToValueAtTime(.0001,t0+1.6);
      o.connect(gn);gn.connect(out);o.start(t0);o.stop(t0+1.7);
    });
    setTimeout(function(){try{ac.close()}catch(e){}},2500);
  }catch(e){}
}
function closeIt(){
  if(closing)return;closing=true;running=false;
  try{au.pause()}catch(e){}
  try{au.src=''}catch(e){}
  try{location.replace('index.html')}catch(e){location.replace('about:blank')}
}
au.addEventListener('playing',onAudioStart);
au.addEventListener('ended',function(){fade.className='on';setTimeout(closeIt,1700)});
addEventListener('click',function(){if(armed)closeIt()});
addEventListener('keydown',function(e){if(armed&&e.key==='Escape')closeIt()});
(function(){
  function boot(){
    if(/[?&]auto=1/.test(location.search)){
      try{var xc=new XMLHttpRequest();xc.open('POST','http://127.0.0.1:2324/show/consume',true);xc.send()}catch(e){}
      setTimeout(begin,300);
    }else{
      hint.textContent='press any key or click to start (Back returns to dashboard)';
      hint.className='on';
    }
  }
  var booted=false;
  function go(){if(booted)return;booted=true;try{layout()}catch(e){};boot()}
  if(document.fonts&&document.fonts.load){
    document.fonts.load('20px SampwnMono').then(go).catch(go);
    setTimeout(go,1500);
  }else{go()}
})();

// ===== draw =====
var prev=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-prev)/1000);prev=now;
  if(running){
    clock=(now-clockT0)/1000;
    while(pi<T.length&&T[pi]<=clock){if(clock-T[pi]<.25)onPulse(pi,T[pi]);pi++}
    while(fi<FL.length&&FL[fi]<=clock){if(clock-FL[fi]<.25)onFlash(FL[fi]);fi++}
    if(!au.paused&&Math.abs(au.currentTime-clock)>0.75){try{au.currentTime=clock}catch(e){}}
  }
  if(intro.className&&clock>=introLen)intro.className='';
  var sa=running?Math.max(0,Math.min(1,(clock-introLen)/1.5)):0;
  var target=running?2.4:.5+Math.min(1.4,clock/T_START*1.4);
  warp+=(target-warp)*.02;
  kick*=.9;
  var w=warp+kick;
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2;
  g.globalAlpha=sa;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    if(sa<=0)break;
    s.z-=w*dt*.3;
    if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1}
    var px=cx+s.x/s.z*cx*.45,py=cy+s.y/s.z*cy*.45;
    if(px<0||px>W||py<0||py>H){s.z=0;continue}
    var pz=s.z+w*dt*.5,qx=cx+s.x/pz*cx*.45,qy=cy+s.y/pz*cy*.45;
    g.strokeStyle='rgba('+(190+pulse*60|0)+',220,255,'+(1-s.z*.75)+')';
    g.lineWidth=(1-s.z)*2.4+.4;
    g.beginPath();g.moveTo(qx,qy);g.lineTo(px+.01,py+.01);g.stroke();
  }
  g.globalAlpha=1;
  // figlet bubble text
  if(started){
    g.font=fs+'px SampwnMono';g.textBaseline='top';g.textAlign='left';
    var sc=1+pulse*.02;
    g.save();g.translate(cx,H*.4);g.scale(sc,sc);g.translate(-cx,-H*.4);
    for(var bi=0;bi<blocks.length;bi++){
      var b=blocks[bi];
      b.shown+=(b.target*cw-b.shown)*.2;
      if(b.shown<1)continue;
      var x0=(W-b.w*cw)/2,y0=topY+b.row0*lh;
      var gr=g.createLinearGradient(x0,0,x0+b.w*cw,0),L=62+pulse*18;
      gr.addColorStop(0,'hsl('+hue+',90%,'+L+'%)');
      gr.addColorStop(.5,'hsl('+(hue+70)+',90%,'+L+'%)');
      gr.addColorStop(1,'hsl('+(hue+140)+',90%,'+L+'%)');
      g.save();
      g.beginPath();g.rect(x0-4,y0-4,b.shown+4,b.rows.length*lh+8);g.clip();
      g.fillStyle=gr;g.shadowColor='hsl('+hue+',100%,60%)';g.shadowBlur=6+pulse*22;
      for(var r=0;r<b.rows.length;r++)g.fillText(b.rows[r],x0,y0+r*lh);
      g.restore();
      if(b.target*cw-b.shown>2){
        g.fillStyle='rgba(255,255,255,.85)';g.fillRect(x0+b.shown,y0,2,b.rows.length*lh);
      }
    }
    g.restore();
  }
  if(flash>.01){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H);flash*=.9}
  pulse*=.9;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
